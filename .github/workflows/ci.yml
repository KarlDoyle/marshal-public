name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Install locked dependencies, then run the same quality commands as pre-push:
# typecheck, lint, coverage-enforced tests and build. Each gate requires the
# previous one to pass; CI always enforces all four.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # No `version:` — pnpm/action-setup@v6 hard-fails when it is set alongside
        # package.json's `packageManager` field, which now pins pnpm@11.5.2.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # 1. Typecheck.
      - name: Typecheck
        run: pnpm typecheck

      # 2. Lint + format check (biome).
      - name: Lint
        run: pnpm lint

      # 3. Tests, including secret scanning, with Vitest's coverage floors.
      - name: Test
        run: pnpm coverage

      # 4. Build.
      - name: Build
        run: pnpm build
